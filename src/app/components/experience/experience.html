<section id="experience" class="relative py-20 min-h-screen flex flex-col items-center justify-center">
  
  <h2 class="text-4xl md:text-5xl font-bold text-center mb-16 relative z-10">
    <span class="bg-clip-text text-transparent bg-gradient-to-r from-white to-cyan-400">
      Work Experience
    </span>
    <div class="h-1 w-24 bg-cyan-500 mx-auto mt-2 rounded-full shadow-[0_0_10px_#00d2ff]"></div>
  </h2>

  <div class="relative w-full max-w-5xl px-4">
    
    <div class="absolute left-4 md:left-1/2 top-0 bottom-0 w-1 bg-white/10 transform md:-translate-x-1/2"></div>

    <div *ngFor="let exp of experiences; let i = index" 
         class="relative mb-12 md:mb-20 flex flex-col md:flex-row items-center w-full group">
      
      <div class="absolute left-4 md:left-1/2 w-8 h-8 rounded-full bg-black border-2 border-cyan-400 z-20 transform -translate-x-1/2 flex items-center justify-center shadow-[0_0_15px_#00d2ff]">
        <div class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse"></div>
      </div>

      <div [ngClass]="{'md:pr-12 md:items-end': i % 2 === 0, 'md:pl-12 md:items-start': i % 2 !== 0}"
           class="w-full md:w-1/2 flex flex-col relative pl-12 md:pl-0">
        
        <div class="liquid-glass p-6 md:p-8 rounded-2xl border-l-4 border-cyan-400 hover:scale-[1.02] transition-transform duration-300 w-full relative overflow-hidden group-hover:shadow-[0_0_30px_rgba(0,210,255,0.15)]">
            
            <div class="flex items-center gap-4 mb-4" 
                 [ngClass]="{'md:flex-row-reverse': i % 2 === 0, 'flex-row': true}">
              
              <div class="w-20 h-20 bg-white rounded-xl p-2 flex-shrink-0 shadow-lg flex items-center justify-center">
                <img [src]="exp.logo" alt="{{exp.company}} Logo" class="w-full h-full object-contain">
              </div>

              <div [ngClass]="{'md:text-right': i % 2 === 0, 'text-left': true}">
                <h3 class="text-xl font-bold text-white">{{ exp.company }}</h3>
                <p class="text-cyan-300 font-medium">{{ exp.role }}</p>
              </div>
            </div>

            <p class="text-sm text-gray-400 mb-6 font-mono" 
               [ngClass]="{'md:text-right': i % 2 === 0}">
               {{ exp.duration }} | {{ exp.location }}
            </p>

            <ul class="text-gray-300 text-sm md:text-base space-y-2 mb-6 text-left list-disc pl-5">
              <li *ngFor="let point of exp.description" class="leading-relaxed">
                {{ point }}
              </li>
            </ul>

            <div class="flex flex-wrap gap-2 mt-auto" 
                 [ngClass]="{'md:justify-end': i % 2 === 0}">
              <span *ngFor="let skill of exp.skills" 
                    class="px-3 py-1 text-xs font-semibold text-cyan-900 bg-cyan-400 rounded-full">
                {{ skill }}
              </span>
            </div>

        </div>
      </div>
      
      <div class="hidden md:block md:w-1/2"></div>

    </div>

  </div>
</section>
