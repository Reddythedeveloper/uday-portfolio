<section id="experience" class="relative py-20 min-h-screen flex flex-col items-center justify-center">
  
  <h2 data-aos="fade-up" class="text-4xl md:text-5xl font-bold text-center mb-16 relative z-10">
    <span class="bg-clip-text text-transparent bg-gradient-to-r from-gray-900 to-cyan-600">
      Work Experience
    </span>
    <div class="h-1 w-24 bg-cyan-500 mx-auto mt-2 rounded-full shadow-sm"></div>
  </h2>

  <div class="relative w-full max-w-4xl px-4 space-y-8 z-10">
    
    <div *ngFor="let exp of experiences" data-aos="fade-up"
         class="liquid-glass p-8 md:p-10 rounded-3xl border border-white/60 hover:scale-[1.01] transition-all duration-500 w-full bg-white/60 shadow-[0_8px_30px_rgb(0,0,0,0.04)] backdrop-blur-xl group hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)]">
        
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
          <div class="flex items-center gap-5">
            <div class="w-16 h-16 bg-white rounded-2xl p-2 flex-shrink-0 shadow-sm border border-gray-100 flex items-center justify-center">
              <img [src]="exp.logo" alt="{{exp.company}} Logo" class="w-full h-full object-contain">
            </div>
            <div>
              <h3 class="text-2xl font-bold text-gray-900">{{ exp.company }}</h3>
              <p class="text-cyan-700 font-medium text-lg">{{ exp.role }}</p>
            </div>
          </div>
          <div class="text-left md:text-right font-mono text-sm text-gray-500 bg-white/50 px-4 py-2 rounded-xl border border-white/40">
            <p class="font-semibold text-gray-700">{{ exp.duration }}</p>
            <p>{{ exp.location }}</p>
          </div>
        </div>

        <ul class="text-gray-700 text-base space-y-3 mb-8 text-left list-none pl-0">
          <li *ngFor="let point of exp.description" class="leading-relaxed relative pl-6 before:content-[''] before:absolute before:left-0 before:top-2.5 before:w-2 before:h-2 before:bg-cyan-500 before:rounded-full">
            {{ point }}
          </li>
        </ul>

        <div class="flex flex-wrap gap-2 pt-4 border-t border-gray-200/50">
          <span *ngFor="let skill of exp.skills" 
                class="px-4 py-1.5 text-xs font-semibold text-cyan-800 bg-cyan-50 border border-cyan-100 rounded-full hover:bg-cyan-100 transition-colors cursor-default">
            {{ skill }}
          </span>
        </div>

    </div>

  </div>
</section>
