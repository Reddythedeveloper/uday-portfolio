<section id="education" class="relative py-20 px-4 flex flex-col items-center justify-center">
  
  <h2 class="text-4xl md:text-5xl font-bold text-center mb-16 relative z-10">
    <span class="bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-500">
      Education
    </span>
    <div class="h-1 w-24 bg-pink-500 mx-auto mt-2 rounded-full shadow-[0_0_15px_#ec4899]"></div>
  </h2>

  <div class="max-w-5xl w-full grid grid-cols-1 md:grid-cols-2 gap-8">
    
    <div *ngFor="let edu of education" 
         class="liquid-glass p-8 rounded-2xl border-l-4 border-pink-500 hover:scale-[1.02] transition-all duration-300 relative overflow-hidden group flex flex-col h-full">
      
      <div class="absolute -right-10 -top-10 w-32 h-32 bg-pink-500/20 blur-3xl rounded-full group-hover:bg-pink-500/30 transition-all"></div>

      <div class="relative z-10 flex flex-col h-full">
        <div class="flex justify-between items-start mb-4">
          <div class="w-16 h-16 bg-white p-2 rounded-lg shadow-lg">
             <img [src]="edu.logo" alt="{{edu.school}}" class="w-full h-full object-contain">
          </div>
          
          <span class="text-xs font-bold tracking-widest text-pink-300 uppercase bg-pink-500/10 px-3 py-1 rounded-full border border-pink-500/20">
            {{ edu.year }}
          </span>
        </div>

        <h3 class="text-2xl font-bold text-white mb-2 leading-tight">
          {{ edu.degree }}
        </h3>
        <p class="text-lg text-gray-300 mb-6">{{ edu.school }}</p>
        
        <div class="mt-auto">
          <div class="inline-block px-4 py-2 bg-pink-500/20 border border-pink-500/50 rounded-lg text-pink-200 text-sm font-mono font-bold">
            GPA: {{ edu.gpa }}
          </div>
        </div>
      </div>

    </div>

  </div>
</section>
