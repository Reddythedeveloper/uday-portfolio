<section id="skills" class="relative py-20 px-4 min-h-screen flex flex-col items-center justify-center bg-white/30">
  
  <h2 data-aos="fade-up" class="text-4xl md:text-5xl font-bold text-center mb-16 relative z-10">
    <span class="bg-clip-text text-transparent bg-gradient-to-r from-emerald-600 to-cyan-600">
      Technical Arsenal
    </span>
    <div class="h-1 w-24 bg-emerald-500 mx-auto mt-2 rounded-full shadow-sm"></div>
  </h2>

  <div class="max-w-6xl w-full grid grid-cols-1 md:grid-cols-3 gap-8">
    
    <div *ngFor="let category of skillCategories; let i = index" data-aos="fade-up" [attr.data-aos-delay]="i * 150" class="liquid-glass bg-white/70 p-6 rounded-2xl border border-gray-200 shadow-md hover:border-emerald-400/50 hover:shadow-lg transition-all duration-300">
      
      <h3 class="text-xl font-bold text-emerald-700 mb-6 text-center uppercase tracking-wider border-b border-gray-300 pb-4">
        {{ category.name }}
      </h3>

      <div class="grid grid-cols-3 gap-6 place-items-center mt-4">
        <div *ngFor="let skill of category.skills" 
             class="group flex flex-col items-center gap-3 cursor-pointer">
          
          <div class="w-16 h-16 md:w-20 md:h-20 p-3 md:p-4 bg-white/60 border border-gray-100 rounded-2xl group-hover:bg-emerald-50 group-hover:border-emerald-200 transition-all duration-300 group-hover:-translate-y-2 shadow-sm group-hover:shadow-xl flex items-center justify-center">
            <img [src]="skill.icon" [alt]="skill.name" class="w-full h-full object-contain filter drop-shadow-sm group-hover:scale-110 transition-transform duration-300">
          </div>
          
          <span class="text-xs md:text-sm text-gray-600 font-semibold group-hover:text-emerald-700 transition-colors text-center">
            {{ skill.name }}
          </span>
        </div>
      </div>

    </div>

  </div>
</section>
