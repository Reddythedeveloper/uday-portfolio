<section id="skills" class="relative py-20 px-4 min-h-screen flex flex-col items-center justify-center bg-black/20">
  
  <h2 class="text-4xl md:text-5xl font-bold text-center mb-16 relative z-10">
    <span class="bg-clip-text text-transparent bg-gradient-to-r from-green-400 to-cyan-500">
      Technical Arsenal
    </span>
    <div class="h-1 w-24 bg-green-500 mx-auto mt-2 rounded-full shadow-[0_0_15px_#22c55e]"></div>
  </h2>

  <div class="max-w-6xl w-full grid grid-cols-1 md:grid-cols-3 gap-8">
    
    <div *ngFor="let category of skillCategories" class="liquid-glass p-6 rounded-2xl border border-white/5 hover:border-green-400/30 transition-all duration-300">
      
      <h3 class="text-xl font-bold text-green-400 mb-6 text-center uppercase tracking-wider border-b border-white/10 pb-4">
        {{ category.name }}
      </h3>

      <div class="grid grid-cols-3 gap-6 place-items-center">
        <div *ngFor="let skill of category.skills" 
             class="group flex flex-col items-center gap-2 cursor-pointer">
          
          <div class="w-14 h-14 p-2 bg-white/5 rounded-xl group-hover:bg-white/10 transition-all duration-300 group-hover:-translate-y-2 group-hover:shadow-[0_0_15px_rgba(34,197,94,0.3)]">
            <img [src]="skill.icon" [alt]="skill.name" class="w-full h-full object-contain filter drop-shadow-lg">
          </div>
          
          <span class="text-xs text-gray-400 group-hover:text-white transition-colors">
            {{ skill.name }}
          </span>
        </div>
      </div>

    </div>

  </div>
</section>
