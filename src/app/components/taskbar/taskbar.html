<div class="fixed top-0 left-1/2 transform -translate-x-1/2 z-50 w-full max-w-3xl px-4 mt-3">
  <div class="bg-white/70 backdrop-blur-xl shadow-[0_8px_30px_rgba(0,0,0,0.06)] border border-white/60 flex items-center justify-between px-6 py-3 rounded-full transition-all duration-300">
    
    <!-- Navigation Links -->
    <div class="flex items-center gap-4 md:gap-8 overflow-x-auto no-scrollbar">
      <a *ngFor="let item of navItems"
         (click)="scrollTo(item.link)"
         class="text-sm font-bold tracking-wide text-slate-700 hover:text-emerald-600 transition-colors cursor-pointer whitespace-nowrap">
         {{ item.label }}
      </a>
    </div>

    <!-- Separator -->
    <div class="hidden md:block w-px h-6 bg-gray-300 mx-2"></div>

    <!-- Socials -->
    <div class="hidden md:flex items-center gap-5">
      <a *ngFor="let social of socials"
         [href]="social.link"
         target="_blank"
         class="text-slate-500 hover:text-emerald-600 hover:scale-110 transition-all cursor-pointer"
         [title]="social.label">
         
         <ng-container [ngSwitch]="social.icon">
            <svg *ngSwitchCase="'github'" class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
            <svg *ngSwitchCase="'linkedin'" class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
            <svg *ngSwitchCase="'mail'" class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
         </ng-container>
      </a>
    </div>

  </div>
</div>
