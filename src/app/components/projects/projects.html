<section id="projects" class="relative py-20 px-4 min-h-screen">
  
  <div class="max-w-7xl mx-auto">
    <h2 data-aos="fade-up" class="text-4xl md:text-5xl font-bold text-center mb-16">
      <span class="bg-clip-text text-transparent bg-gradient-to-r from-cyan-600 to-purple-700">
        Projects & Research
      </span>
      <div class="h-1 w-24 bg-purple-500 mx-auto mt-2 rounded-full shadow-sm"></div>
    </h2>

    <div data-aos="fade-up" class="liquid-glass bg-white/60 shadow-[0_8px_30px_rgb(0,0,0,0.04)] backdrop-blur-xl rounded-3xl p-6 md:p-10 mb-12 hover:scale-[1.01] transition-all duration-500 border border-white/60 group hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)]">
      <div class="flex flex-col md:flex-row gap-8 items-center">
        
        <div class="w-full md:w-1/2 h-64 md:h-80 rounded-xl overflow-hidden relative">
          <img [src]="publication.image" alt="Research Paper" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700">
          <div class="absolute top-4 left-4 bg-purple-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider shadow-lg">
            Featured Publication
          </div>
        </div>

        <div class="w-full md:w-1/2">
          <h3 class="text-2xl md:text-3xl font-bold text-gray-900 mb-2 group-hover:text-purple-700 transition-colors">
            {{ publication.title }}
          </h3>
          <p class="text-purple-700 font-medium mb-4 italic">{{ publication.subtitle }}</p>
          <p class="text-gray-700 mb-6 leading-relaxed">
            {{ publication.description }}
          </p>

          <div class="flex flex-wrap gap-2 mb-8">
            <span *ngFor="let tag of publication.tags" class="px-3 py-1 bg-purple-100 text-purple-800 border border-purple-200 rounded-full text-xs">
              {{ tag }}
            </span>
          </div>

          <div class="flex flex-wrap gap-4">
             <a [href]="publication.link" target="_blank" class="inline-flex items-center gap-2 px-6 py-3 bg-purple-600 hover:bg-purple-700 text-white rounded-lg transition-all shadow-md hover:shadow-lg">
               <span>Read Paper</span>
               <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
             </a>

             <a *ngIf="publication.videoLink" 
                [href]="publication.videoLink" 
                target="_blank" 
                class="inline-flex items-center gap-2 px-6 py-3 border border-purple-500/50 hover:bg-purple-50 text-purple-700 hover:text-purple-900 rounded-lg transition-all">
               <span>Watch Demo</span>
               <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
             </a>
          </div>

        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      
      <div *ngFor="let project of projects; let i = index" data-aos="zoom-in-up" [attr.data-aos-delay]="i * 100" class="liquid-glass bg-white/60 backdrop-blur-xl rounded-2xl overflow-hidden hover:-translate-y-2 transition-transform duration-300 group flex flex-col h-full border border-white/60 hover:border-cyan-400/50 shadow-[0_4px_20px_rgb(0,0,0,0.03)] hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)]">
        
        <div class="h-48 overflow-hidden relative">
          <img [src]="project.image" [alt]="project.title" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500">
          
          <div class="absolute top-3 right-3 bg-white/90 backdrop-blur-md text-cyan-700 text-xs font-bold px-2 py-1 rounded border border-cyan-200 shadow-sm">
            {{ project.category }}
          </div>
        </div>

        <div class="p-6 flex-1 flex flex-col">
          <h3 class="text-xl font-bold text-gray-900 mb-2 group-hover:text-cyan-700 transition-colors">
            {{ project.title }}
          </h3>
          
          <p class="text-gray-600 text-sm mb-4 line-clamp-3">
            {{ project.description }}
          </p>

          <div class="flex flex-wrap gap-2 mb-6 mt-auto">
            <span *ngFor="let tag of project.tags | slice:0:3" class="text-xs text-gray-700 bg-gray-100 px-2 py-1 rounded border border-gray-200">
              #{{ tag }}
            </span>
            <span *ngIf="project.tags.length > 3" class="text-xs text-gray-500 px-1 py-1">+{{project.tags.length - 3}}</span>
          </div>

          <a [href]="project.link" target="_blank" class="mt-auto w-full block text-center py-2 rounded-lg border border-gray-200 text-gray-700 hover:bg-cyan-50 hover:border-cyan-400 hover:text-cyan-700 transition-all text-sm font-semibold">
            View Project
          </a>
        </div>

      </div>

    </div>
  </div>
</section>
