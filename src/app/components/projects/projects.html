<section id="projects" class="relative py-20 px-4 min-h-screen">
  
  <div class="max-w-7xl mx-auto">
    <h2 class="text-4xl md:text-5xl font-bold text-center mb-16">
      <span class="bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-purple-500">
        Projects & Research
      </span>
      <div class="h-1 w-24 bg-purple-500 mx-auto mt-2 rounded-full shadow-[0_0_15px_#a855f7]"></div>
    </h2>

    <div class="liquid-glass rounded-3xl p-6 md:p-10 mb-12 hover:scale-[1.01] transition-all duration-500 border border-purple-500/30 group">
      <div class="flex flex-col md:flex-row gap-8 items-center">
        <div class="w-full md:w-1/2 h-64 md:h-80 rounded-xl overflow-hidden relative">
          <img [src]="publication.image" alt="Research Paper" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700">
          <div class="absolute top-4 left-4 bg-purple-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider shadow-lg">
            Featured Publication
          </div>
        </div>

        <div class="w-full md:w-1/2">
          <h3 class="text-2xl md:text-3xl font-bold text-white mb-2 group-hover:text-purple-300 transition-colors">
            {{ publication.title }}
          </h3>
          <p class="text-purple-200 font-medium mb-4 italic">{{ publication.subtitle }}</p>
          <p class="text-gray-300 mb-6 leading-relaxed">
            {{ publication.description }}
          </p>

          <div class="flex flex-wrap gap-2 mb-8">
            <span *ngFor="let tag of publication.tags" class="px-3 py-1 bg-purple-500/20 text-purple-300 border border-purple-500/30 rounded-full text-xs">
              {{ tag }}
            </span>
          </div>

          <a [href]="publication.link" target="_blank" class="inline-flex items-center gap-2 px-6 py-3 bg-purple-600 hover:bg-purple-500 text-white rounded-lg transition-all shadow-[0_0_15px_rgba(147,51,234,0.4)] hover:shadow-[0_0_25px_rgba(147,51,234,0.6)]">
            <span>Read Paper</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
          </a>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      
      <div *ngFor="let project of projects" class="liquid-glass rounded-2xl overflow-hidden hover:-translate-y-2 transition-transform duration-300 group flex flex-col h-full border border-white/5 hover:border-cyan-400/50">
        
        <div class="h-48 overflow-hidden relative">
          <img [src]="project.image" [alt]="project.title" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500">
          
          <div class="absolute top-3 right-3 bg-black/60 backdrop-blur-md text-cyan-400 text-xs font-bold px-2 py-1 rounded border border-cyan-400/30">
            {{ project.category }}
          </div>
        </div>

        <div class="p-6 flex-1 flex flex-col">
          <h3 class="text-xl font-bold text-white mb-2 group-hover:text-cyan-400 transition-colors">
            {{ project.title }}
          </h3>
          
          <p class="text-gray-400 text-sm mb-4 line-clamp-3">
            {{ project.description }}
          </p>

          <div class="flex flex-wrap gap-2 mb-6 mt-auto">
            <span *ngFor="let tag of project.tags | slice:0:3" class="text-xs text-gray-300 bg-white/5 px-2 py-1 rounded">
              #{{ tag }}
            </span>
            <span *ngIf="project.tags.length > 3" class="text-xs text-gray-500 px-1 py-1">+{{project.tags.length - 3}}</span>
          </div>

          <a [href]="project.link" target="_blank" class="mt-auto w-full block text-center py-2 rounded-lg border border-white/10 hover:bg-cyan-500/20 hover:border-cyan-400 hover:text-cyan-300 transition-all text-sm font-semibold">
            View Project
          </a>
        </div>

      </div>

    </div>
  </div>
</section>
