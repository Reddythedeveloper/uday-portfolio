<section id="home" class="relative w-full min-h-screen flex items-center justify-center overflow-hidden bg-transparent pt-20">
  
  <!-- CSS Animated Glowing Orbs Background -->
  <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-[10%] -left-[10%] w-[40vw] h-[40vw] max-w-[600px] max-h-[600px] bg-indigo-300/40 rounded-full mix-blend-multiply filter blur-[100px] animate-blob"></div>
    <div class="absolute top-[20%] -right-[10%] w-[35vw] h-[35vw] max-w-[500px] max-h-[500px] bg-cyan-300/40 rounded-full mix-blend-multiply filter blur-[100px] animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-[10%] left-[20%] w-[45vw] h-[45vw] max-w-[700px] max-h-[700px] bg-pink-300/40 rounded-full mix-blend-multiply filter blur-[100px] animate-blob animation-delay-4000"></div>
  </div>

  <div class="relative z-10 w-full max-w-7xl mx-auto px-6 md:px-12 lg:px-20 grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-8 items-center">
    
    <!-- Left Text Content -->
    <div data-aos="fade-right" data-aos-duration="1000" class="flex flex-col items-start text-left space-y-6 mt-10 lg:mt-0">
      
      <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-emerald-50 border border-emerald-100 shadow-sm">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-xs font-semibold text-emerald-700 tracking-wide uppercase">Open to new opportunities</span>
      </div>

      <h1 class="text-5xl md:text-7xl lg:text-8xl font-extrabold text-slate-900 leading-[1.1] tracking-tight">
        Uday<br/>
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 via-purple-600 to-cyan-500">K</span>
      </h1>

      <p class="text-lg md:text-xl text-gray-600 font-medium max-w-lg leading-relaxed">
        Building scalable <span class="text-indigo-600 font-semibold">AI Architectures</span> and high-performance <span class="text-cyan-600 font-semibold">Full-Stack Solutions</span>. Translating complex engineering into premium user experiences.
      </p>

      <div class="flex flex-wrap gap-4 pt-4">
        <button (click)="scrollTo('projects')" class="group relative px-8 py-4 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-2xl transition-all shadow-lg hover:shadow-xl hover:-translate-y-1 overflow-hidden">
          <span class="relative z-10 flex items-center gap-2">
            Explore Work
            <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
          </span>
          <div class="absolute inset-0 bg-gradient-to-r from-indigo-600 to-cyan-500 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
        </button>
        
        <button (click)="scrollTo('experience')" class="px-8 py-4 bg-white/70 hover:bg-white backdrop-blur-md text-slate-900 font-semibold rounded-2xl transition-all border border-gray-200 shadow-sm hover:shadow-md hover:-translate-y-1">
          View Experience
        </button>
      </div>

    </div>

    <!-- Right Image Content -->
    <div data-aos="fade-left" data-aos-duration="1000" data-aos-delay="200" class="relative flex justify-center lg:justify-end pb-16 lg:pb-0">
      
      <div class="relative w-72 h-72 md:w-96 md:h-96">
        <!-- Floating decorative elements -->
        <div class="absolute -top-6 -left-6 w-24 h-24 bg-cyan-300/30 rounded-full blur-2xl animate-pulse"></div>
        <div class="absolute -bottom-8 -right-8 w-32 h-32 bg-purple-400/30 rounded-full blur-2xl animate-pulse" style="animation-delay: 1s;"></div>
        
        <div class="relative w-full h-full rounded-3xl overflow-hidden shadow-[0_20px_50px_rgba(0,0,0,0.15)] border-4 border-white/60 bg-white/30 backdrop-blur-sm transform transition-transform hover:scale-105 duration-700">
          <img src="assets/images/profile.png" 
               alt="Uday Kiran Reddy K" 
               class="w-full h-full object-cover"
               onerror="this.style.display='none'" />
        </div>
        
        <!-- Tech floating badges -->
        <div class="absolute -right-4 top-10 bg-white/80 backdrop-blur-md px-4 py-2 rounded-xl shadow-lg border border-white/60 animate-bounce" style="animation-duration: 3s;">
          <span class="font-bold text-slate-800 text-sm">GenAI</span>
        </div>
        <div class="absolute -left-8 bottom-20 bg-white/80 backdrop-blur-md px-4 py-2 rounded-xl shadow-lg border border-white/60 animate-bounce" style="animation-duration: 4s;">
          <span class="font-bold text-slate-800 text-sm">Full-Stack</span>
        </div>

      </div>

    </div>

  </div>
  
  <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 animate-bounce z-10 opacity-60 hover:opacity-100 transition-opacity cursor-pointer" (click)="scrollTo('experience')">
     <svg class="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
  </div>

</section>
